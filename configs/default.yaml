# Qwen2-VL-2B QLoRA on CORD-v2, sized for a single 16 GB free-tier GPU.
# Rationale for these values is in DECISIONS.md.

model_id: Qwen/Qwen2-VL-2B-Instruct
output_dir: runs/qlora
seed: 42

# --- data ---
# 512 visual patches ~= a legible receipt. Raising this is the first thing that
# will OOM you; lowering it is the first thing that will cost you small-print
# accuracy on line items.
max_pixels: 401408          # 512 * 28 * 28
train_limit: null           # null = full CORD train split
val_limit: 40
eval_limit: 50              # test-split subset used for the corruption sweep

# --- LoRA ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- optimisation ---
epochs: 3
batch_size: 1
grad_accum: 8               # effective batch of 8
gradient_checkpointing: true
learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
max_grad_norm: 0.3
attn_implementation: eager  # sdpa/flash-attn are faster but less portable across free tiers

# --- logging / checkpointing ---
logging_steps: 10
eval_steps: 100
save_steps: 100
num_workers: 2
resume_from_checkpoint: null

# --- generation ---
max_new_tokens: 768         # see DECISIONS.md #16 — must clear p100 of target lengths (573)
